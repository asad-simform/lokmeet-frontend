<div class="min-h-screen flex items-center justify-center">
    <div
        class="max-w-xl w-full space-y-8 bg-white dark:bg-gray-800 p-8 rounded-2xl shadow-xl border border-gray-100 dark:border-gray-700 text-center"
    >
        <div>
            <div
                class="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-blue-100 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400"
            >
                <i class="pi pi-shield text-2xl"></i>
            </div>
            <h2 class="mt-6 text-3xl font-extrabold text-gray-950 dark:text-white">
                Security Verification
            </h2>
            <p class="mt-2 text-sm text-gray-600 dark:text-gray-400">
                We sent a verification code to your email. Please enter the 6-digit code below.
            </p>
        </div>

        <form [formGroup]="otpForm" (ngSubmit)="onSubmit()" class="mt-8 space-y-6">
            <div class="flex justify-center">
                <p-inputOtp
                    formControlName="otpCode"
                    class="bg-gray-800"
                    [length]="6"
                    [integerOnly]="true"
                >
                </p-inputOtp>
            </div>

            <div class="text-sm">
                @if (!canResend()) {
                    <p class="text-gray-500 dark:text-gray-400">
                        Resend code in
                        <span class="font-semibold text-gray-700 dark:text-gray-200"
                            >{{ timeLeft() }}s</span
                        >
                    </p>
                } @else {
                    <button
                        type="button"
                        (click)="resendOtp()"
                        class="font-medium text-blue-600 hover:text-blue-500 dark:text-blue-400 dark:hover:text-blue-300 transition-colors focus:outline-none focus:underline"
                    >
                        Resend Code
                    </button>
                }
            </div>

            @if (otpForm.get('otpCode')?.touched && otpForm.get('otpCode')?.invalid) {
                <div class="text-sm text-red-500 dark:text-red-400">
                    Please complete the 6-digit code sequence.
                </div>
            }

            <div>
                <button
                    pButton
                    pRipple
                    type="submit"
                    label="Verify Code"
                    class="w-full justify-center text-white bg-blue-600 hover:bg-blue-700 dark:bg-blue-500 dark:hover:bg-blue-600 font-bold py-3 px-4 rounded-lg shadow transition duration-200 disabled:opacity-50 disabled:cursor-not-allowed"
                ></button>
            </div>
        </form>
    </div>
</div>
