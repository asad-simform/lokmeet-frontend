<nav
    class="bg-white dark:bg-gray-900 border-b border-gray-200 dark:border-gray-800 transition-colors duration-300 sticky top-0 z-50"
>
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-16">
            <div class="flex items-center gap-2 cursor-pointer">
                <div
                    class="flex items-center justify-center h-9 w-9 rounded-xl bg-linear-to-tr from-blue-600 to-indigo-500 text-white shadow-md"
                >
                    <i class="pi pi-users text-lg"></i>
                </div>
                <span class="text-2xl font-black text-gray-900 dark:text-white tracking-tight">
                    Lok<span class="text-blue-600 dark:text-blue-400">Meet</span>
                </span>
            </div>

            <div class="flex items-end space-x-8"></div>

            <div class="hidden md:flex items-center gap-4">
                <button
                    routerLink="/"
                    class="hover:cursor-pointer text-sm font-semibold text-blue-600 dark:text-blue-400 flex items-center gap-1.5"
                >
                    <span
                        class="w-1.5 h-1.5 rounded-full bg-blue-600 dark:bg-blue-400 animate-pulse"
                    ></span>
                    Discover Events
                </button>
                @if (!isUserLoggedIn()) {
                    <a
                        routerLink="/login"
                        class="text-sm font-semibold text-gray-700 dark:text-gray-300 hover:text-blue-600 dark:hover:text-blue-400 transition-colors"
                        >Log In</a
                    >
                    <button
                        routerLink="/signup"
                        pButton
                        pRipple
                        label="Sign Up"
                        class="bg-blue-600 hover:bg-blue-700 dark:bg-blue-500 dark:hover:bg-blue-600 text-white text-sm font-bold py-2.5 px-4 rounded-xl border-none transition-all shadow-sm"
                    ></button>
                } @else {
                    <button
                        pRipple
                        label="Logout"
                        (click)="logout()"
                        class="bg-transparent hover:cursor-pointer"
                    >
                        Logout
                    </button>
                    <button
                        routerLink="/profile"
                        pButton
                        pRipple
                        label="Profile"
                        class="bg-blue-600 hover:bg-blue-700 dark:bg-blue-500 dark:hover:bg-blue-600 text-white text-sm font-bold py-2.5 px-4 rounded-xl border-none transition-all shadow-sm"
                    ></button>
                }
            </div>
        </div>
    </div>
</nav>
